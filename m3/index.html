<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M.3 English Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="unit6/app.css">
<style>
body{background:linear-gradient(160deg,#fff6f8 0%,#fdeef2 55%,#fff8f3 100%)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#d63e66 0%,#b8274f 100%);color:#fff;padding:20px 14px;border-radius:0 28px 28px 0;box-shadow:6px 0 24px rgba(160,30,70,.25);z-index:30}
.side .bloom{position:absolute;left:0;top:0;width:100%;height:130px;pointer-events:none;opacity:.6}
.brand{position:relative;text-align:center;padding:6px 6px 18px}
.crest{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;background:#fff;color:var(--rose);display:grid;place-items:center;font:700 24px Kanit;border:4px solid #f7c9d6;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.brand b{font:600 15px Kanit;display:block}
.brand small{font-size:12px;opacity:.9}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;text-decoration:none;color:#fff;font:500 17px Kanit}
.nav a:hover{background:rgba(255,255,255,.14)}
.nav a.on{background:#fff;color:var(--rose);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.nav svg{width:22px;height:22px;flex:none}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.3);margin:8px 6px;width:auto}
.side .foot{margin-top:18px;font-size:13px;opacity:.85;padding:0 8px;line-height:1.5}
main{padding:18px 26px 50px;min-width:0}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px}
.hello{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:8px 10px 8px 14px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.hello .bell{font-size:24px}
.hello b{font:600 16px Kanit;display:block;line-height:1.2}
.hello small{color:var(--muted);font-size:13px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--rose-l);color:var(--rose);display:grid;place-items:center;font:700 15px Kanit}
.menu-btn{display:none}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
/* banner */
.banner{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,#fff 0%,#fff1f5 45%,#fde2ea 100%);box-shadow:var(--shadow);min-height:250px;display:flex;align-items:center;padding:28px 34px}
.banner svg.scene{position:absolute;right:0;bottom:0;height:100%;width:60%;pointer-events:none}
.banner .txt{position:relative;max-width:560px}
.banner h1{font-size:clamp(34px,4.4vw,60px);font-weight:700;color:var(--rose);letter-spacing:-.5px;line-height:1.05}
.banner h1 span{display:block;color:#2c2140;font-size:.85em}
.banner .tagline{display:inline-block;margin-top:14px;background:#fff;border-radius:16px;padding:10px 18px;box-shadow:0 6px 18px rgba(200,50,90,.15)}
.banner .tagline b{display:block;font:600 21px Kanit;color:var(--rose-d)}
.banner .tagline small{font-size:15px;color:var(--muted)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}
.sec h2{font-size:23px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec a{color:var(--rose-d);font:500 15px Kanit}
/* unit tiles */
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
.tile{position:relative;border-radius:22px;padding:12px 8px 14px;text-align:center;text-decoration:none;color:var(--ink);background:var(--bg);box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.tile img{width:100%;max-width:130px;height:86px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.tile .pn{margin-top:-8px;background:var(--pc);color:#fff;border-radius:12px;padding:1px 12px;font:600 15px Kanit;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.tile b{font:600 17px Kanit;line-height:1.2;margin-top:4px}
.tile.off{opacity:.6}
.tile .soon{position:absolute;top:8px;right:8px;font:600 10px Kanit;background:#b9a6b0;color:#fff;border-radius:8px;padding:1px 6px}
.tile .open{position:absolute;top:8px;right:8px;font:600 10px Kanit;background:var(--pc);color:#fff;border-radius:8px;padding:1px 6px}
/* dashboard */
.dash{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:18px;margin-top:20px}
.dash .card h3{font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cont{display:flex;gap:14px;align-items:center;background:var(--blush);border-radius:18px;padding:12px}
.cont .thumb{width:100px;height:82px;border-radius:14px;background:var(--bg) center 85%/cover;display:grid;place-items:center;flex:none}
.cont .thumb img{width:84px;height:62px;object-fit:contain}
.cont b{font:600 18px Kanit;display:block}
.cont small{color:var(--rose-d)}
.bar{height:10px;border-radius:6px;background:#f6d6df;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8507a,#c8325a)}
.go{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;flex:none;text-decoration:none;font-size:18px;box-shadow:0 6px 14px rgba(200,50,90,.35)}
.goals{list-style:none;margin:0;padding:0}
.goals li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:16px}
.goals li:last-child{border:0}
.goals .ck{width:24px;height:24px;border-radius:7px;border:2px solid #e3c4ce;display:grid;place-items:center;flex:none;font-size:15px;color:#fff}
.goals li.y .ck{background:#2e9d57;border-color:#2e9d57}
.goals li a{color:inherit;text-decoration:none;flex:1}
.prog{display:flex;align-items:center;gap:14px}
.ring{width:132px;height:132px;flex:none}
.legend{list-style:none;margin:0;padding:0;flex:1;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span{margin-left:auto;font-weight:700}
.skills-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin-top:20px}
.skill{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:1px solid #fbe3ea;transition:transform .15s}
.skill:hover{transform:translateY(-3px)}
.skill img{width:76px;height:58px;object-fit:contain}
.skill b{display:block;font:600 17px Kanit}
.skill small{color:var(--muted);font-size:13px}
/* user picker */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.role{position:relative;border:3px solid var(--line);background:#fff;border-radius:28px;padding:0;text-align:left;overflow:hidden;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column}
.role .art{height:150px;background:var(--bg) center 85%/cover no-repeat;display:flex;align-items:flex-end;justify-content:center}
.role .art img{width:150px;height:118px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15));margin-bottom:-6px}
.role .tx{padding:16px 20px 18px}
.role b{display:block;font:600 26px Kanit}
.role small{color:var(--muted);font-size:15px}
.role.on{border-color:var(--rose);box-shadow:0 0 0 5px var(--rose-l),var(--shadow)}
.role.on::after{content:"✓";position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-weight:700}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.how div{background:var(--blush);border-radius:18px;padding:14px}
.how b{font:600 18px Kanit;display:block}
/* contents covers */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.u{position:relative;background:#fff;border-radius:26px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;border:1px solid #fbe3ea}
.cover{position:relative;height:178px;background:var(--bg) center 88%/cover no-repeat;display:flex;align-items:flex-end;padding:14px 16px}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.55) 100%)}
.cover img{position:absolute;right:12px;bottom:10px;width:150px;height:112px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));transition:transform .25s}
.u:hover .cover img{transform:translateY(-4px) rotate(-3deg)}
.cover .num{position:relative;font:700 46px/1 Kanit;color:var(--c);background:rgba(255,255,255,.92);border-radius:18px;padding:6px 14px 8px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.cover .num small{display:block;font:600 12px Kanit;color:var(--muted);letter-spacing:.5px}
.cover .tag{position:absolute;top:12px;left:12px;font:600 13px Kanit;border-radius:10px;padding:3px 10px;background:var(--c);color:#fff}
.u .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.u .no{font:600 14px Kanit;color:var(--c)}
.u b{font:600 24px Kanit}
.u small{color:var(--muted);font-size:14px;line-height:1.45}
.u.off .cover{filter:grayscale(.35) opacity(.75)}
.u.off .cover .tag{background:#b9a6b0}
.u .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
@media (max-width:1200px){.tiles,.skills-row{grid-template-columns:repeat(4,minmax(0,1fr))}.dash{grid-template-columns:1fr 1fr}.dash .card:first-child{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:250px;transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--rose);color:#fff;border-radius:14px;padding:10px 14px;font:500 16px Kanit;margin-right:auto}
  main{padding:12px}
  .banner{padding:22px;min-height:210px}.banner svg.scene{opacity:.3;width:100%}
  .dash,.pick{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.skills-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hello small{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <svg class="bloom" viewBox="0 0 250 130" aria-hidden="true"><g fill="#ffd3df"><circle cx="18" cy="16" r="10"/><circle cx="40" cy="8" r="7"/><circle cx="226" cy="22" r="9"/><circle cx="206" cy="10" r="6"/><circle cx="240" cy="52" r="6"/></g></svg>
  <div class="brand"><div class="crest">WR</div><b>Woraratchatinadamatuwittaya</b><small>อ23102 · ม.3 · ภาคเรียนที่ 2/2569</small></div>

  <p class="foot">Get Involved! ม.3<br>ครูปรัชญา ทรงบรรพต</p>

  <section class="view" id="v-login"></section>
  <section class="view" id="v-contents"></section>
</main>
</div>
<script>
(function () {

const SS = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const TEACHER_HASH = "70300ccd47da1a93cc88b1fe027be4dd37727d3d7805f238dd5009f1a9a87d8a";

      <g fill="#ffe9ef"><rect x="8" y="8" width="22" height="18" rx="3"/><rect x="36" y="8" width="22" height="18" rx="3"/><rect x="64" y="8" width="22" height="18" rx="3"/><rect x="92" y="8" width="20" height="18" rx="3"/><rect x="8" y="42" width="22" height="16" rx="3"/><rect x="36" y="42" width="22" height="16" rx="3"/><rect x="64" y="42" width="22" height="16" rx="3"/></g>

  const C = 2 * Math.PI * 54;
  const left = role === "teacher"
    ? `<div class="card"><h3>📽️ สไลด์สอน Unit 6</h3><div class="cont"><div class="thumb" style="--bg:url(assets/bg/unit6.svg)"><img src="assets/icons/unit6.png" alt=""></div>
        <div style="flex:1;min-width:0"><b>Unit 6: Experience</b><small>25 สไลด์ · โน้ตครู · แอนิเมชันเฉลย</small></div><a class="go" href="${u.dir}#teacher" aria-label="เปิดสไลด์สอน">▶</a></div></div>`
    : `<div class="card"><h3>📖 Continue Learning</h3><div class="cont"><div class="thumb" style="--bg:url(assets/bg/unit6.svg)"><img src="assets/icons/unit6.png" alt=""></div>
        <div style="flex:1;min-width:0"><b>Unit 6: Experience</b><small>Present perfect · ever / never</small><div class="bar"><i style="width:${me ? pct : 0}%"></i></div><small style="color:var(--muted)">${me ? pct + "% ของเป้าหมาย" : "เลือกผู้ใช้งานก่อนเริ่ม"}</small></div>
        <a class="go" href="${me ? u.dir + "#map" : "#login"}" aria-label="เรียนต่อ">▶</a></div></div>`;
  const mid = role === "teacher"
    ? `<div class="card"><h3>🎯 เมนูครู</h3><ul class="goals"><li><span class="ck">📽️</span><a href="${u.dir}#teacher">เปิดสไลด์สอน + เฉลย</a></li><li><span class="ck">📊</span><a href="${u.dir}#teacher-results">ดูผลนักเรียน / ดาวน์โหลด CSV</a></li><li><span class="ck">📖</span><a href="${u.dir}#map">ทดลองใช้บทเรียน (ไม่ส่งคะแนน)</a></li><li><span class="ck">🗂️</span><a href="#contents">สารบัญทุกหน่วย</a></li></ul></div>`
    : `<div class="card"><h3>🎯 Today's Goals</h3><ul class="goals">${(u.goals || []).map(([sk, st, t, h], n) => `<li class="${goalsDone[n] ? "y" : ""}"><span class="ck">${goalsDone[n] ? "✓" : ""}</span><a href="${u.dir}#${h}">${t}</a></li>`).join("")}</ul></div>`;
  const right = role === "teacher"
    ? `<div class="card"><h3>📊 คะแนนเก็บ Unit 6</h3><ul class="legend">${SKILLS.map(([k, n, , , c]) => `<li><i style="background:${c}"></i>${n}<span>${u.points[k]}</span></li>`).join("")}<li><i style="background:var(--rose)"></i><b>รวม</b><span>10</span></li></ul><p class="muted" style="font-size:13px;margin:8px 0 0">+ ชิ้นงาน 10 · กลางภาค 20 · ปลายภาค 20 · จิตพิสัย 10 · มาเรียน 10</p></div>`
    : `<div class="card"><h3>📊 My Progress</h3><div class="prog"><svg class="ring" viewBox="0 0 132 132"><circle cx="66" cy="66" r="54" fill="none" stroke="#f8dbe3" stroke-width="14"/>
        <circle cx="66" cy="66" r="54" fill="none" stroke="#e8507a" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - overall / 100)}" transform="rotate(-90 66 66)"/>
        <text x="66" y="70" text-anchor="middle" font-family="Kanit" font-size="30" font-weight="600" fill="#3a2330">${overall}%</text><text x="66" y="92" text-anchor="middle" font-size="13" fill="#7c6470">Overall</text></svg>
        <ul class="legend">${per.map(([n, c, v]) => `<li><i style="background:${c}"></i>${n}<span>${v}%</span></li>`).join("")}</ul></div></div>`;
  $("#v-home").innerHTML = `<div class="banner">${scene()}<div class="txt"><h1>M.3 English <span>Learning Platform</span></h1>
      <div class="tagline"><b>English for Real Life</b><small>Learn · Practice · Play · Communicate</small></div></div></div>
    <div class="sec"><h2>📚 Learning Units</h2><a href="#contents">ดูสารบัญทั้งเล่ม →</a></div>
    <div class="tiles">${UNITS.map(x => `<a class="tile ${x.dir ? "" : "off"}" href="${x.dir ? (role === "teacher" ? x.dir + "#teacher" : (me ? x.dir + "#map" : "#login")) : "#contents"}" style="--bg:${x.bg};--pc:${x.pc}">
        ${x.dir ? '<span class="open">เปิดเรียน</span>' : '<span class="soon">เร็ว ๆ นี้</span>'}<img src="assets/icons/unit${x.n}.png" alt=""><span class="pn">Unit ${x.n}</span><b>${x.t}</b></a>`).join("")}</div>
    <div class="dash">${left}${mid}${right}</div>
    <div class="skills-row">${SKILLS.map(([k, n, d, ic]) => `<a class="skill" href="${me || role === "teacher" ? u.dir + "#" + k : "#login"}"><img src="assets/icons/${ic}.png" alt=""><b>${n}</b><small>${d}</small></a>`).join("")}
      <a class="skill" href="${me || role === "teacher" ? u.dir + "#slides" : "#login"}"><img src="assets/icons/gamepad.png" alt=""><b>Slides</b><small>Review & Fun</small></a>
      <a class="skill" href="${me || role === "teacher" ? u.dir + "#posttest" : "#login"}"><img src="assets/icons/trophy.png" alt=""><b>Unit Test</b><small>Check Your Level</small></a></div>`;
}
function viewLogin() {
  $("#v-login").innerHTML = `<div class="banner" style="min-height:190px">${scene()}<div class="txt"><h1 style="font-size:46px">เลือกผู้ใช้งาน</h1>
      <div class="tagline"><b>นักเรียน หรือ ครู</b><small>นักเรียนลงชื่อครั้งเดียวใช้ได้ทุกหน่วย · ครูใช้รหัสครู</small></div></div></div>
    <div class="pick" style="margin-top:18px">
      <button class="role ${pickRole === "student" ? "on" : ""}" data-r="student" style="--bg:url(assets/bg/unit6.svg)"><span class="art"><img src="assets/icons/az.png" alt=""></span>
        <span class="tx"><b>นักเรียน</b><small>เรียน 6 สถานี ฝึกพูด ทำข้อสอบย่อย ส่งคะแนนให้ครู และเปิดสไลด์ทบทวนเอง</small></span></button>
      <button class="role ${pickRole === "teacher" ? "on" : ""}" data-r="teacher" style="--bg:url(assets/bg/unit3.svg)"><span class="art"><img src="assets/icons/clipboard.png" alt=""></span>
        <span class="tx"><b>ครู</b><small>สไลด์สอน แอนิเมชันเฉลย โน้ตครู และผลนักเรียน (ใช้รหัสครู)</small></span></button></div>
    <div class="card" id="rf" style="margin-top:18px"></div>
    <div class="card" style="margin-top:18px"><h3>ขั้นตอนการใช้</h3><div class="how">
      <div><b>1 · เลือกผู้ใช้งาน</b>นักเรียนกรอกชื่อ ห้อง เลขที่ · ครูใส่รหัสครู</div><div><b>2 · สารบัญ</b>เลือกหน่วยตามหนังสือ Get Involved! ม.3</div>
      <div><b>3 · บทเรียน</b>6 สถานี + สไลด์บทเรียน (เลือกหน้าได้) + ข้อสอบหลังเรียน</div><div><b>4 · ทบทวน</b>กลับมาเปิดสไลด์และแบบฝึกซ้ำได้ตลอด</div></div></div>`;
  const form = () => {
    const rf = $("#rf");
    if (pickRole === "teacher") {
      if (role === "teacher") { rf.innerHTML = `<h3>เข้าสู่โหมดครูแล้ว</h3><div class="row" style="margin-top:10px"><a class="btn p" href="#home">ไปหน้า Home →</a><button class="btn" id="out">ออกจากโหมดครู</button></div>`;
        $("#out").onclick = () => { SS.del("m3:t"); SS.del("m3:tp"); role = me ? "student" : null; pickRole = role; route(); }; return; }
      rf.innerHTML = `<h3>รหัสครู</h3><form id="tf" class="row" style="margin-top:10px;max-width:460px"><input class="inp" id="tc" type="password" inputmode="numeric" autocomplete="off" placeholder="ใส่รหัสครู" style="flex:1"><button class="btn p">เข้าโหมดครู</button></form><div id="te"></div>`;
      $("#tc").focus();
      $("#tf").onsubmit = async e => { e.preventDefault(); let ok = false; const c = $("#tc").value.trim();
        try { ok = (await sha("m3-teacher:" + c)) === TEACHER_HASH; } catch (er) {}
        if (!ok) { $("#te").innerHTML = `<div class="fb bad">รหัสไม่ถูกต้อง</div>`; return; }
        SS.set("m3:t", "1"); SS.set("m3:tp", c); role = "teacher"; location.hash = "#home"; };
      return;
    }
    if (pickRole !== "student") { rf.innerHTML = `<p class="muted">เลือก “นักเรียน” หรือ “ครู” ด้านบน</p>`; return; }
    rf.innerHTML = `<h3>ลงชื่อนักเรียน</h3><form id="f" class="opts" style="max-width:560px;margin-top:10px">
      <input class="inp" name="name" placeholder="ชื่อ–นามสกุล" maxlength="80" required value="${me ? esc(me.name) : ""}">
      <div class="row"><input class="inp" name="cls" placeholder="ห้อง เช่น ม.3/1" maxlength="20" required style="flex:1" value="${me ? esc(me.cls) : ""}">
      <input class="inp" name="no" placeholder="เลขที่" maxlength="10" required inputmode="numeric" style="width:120px" value="${me ? esc(me.no) : ""}"></div>
      <div class="row"><button class="btn p" type="submit">${me ? "บันทึกและไปหน้า Home →" : "เข้าใช้ระบบ →"}</button>${me ? `<button class="btn" type="button" id="out">ออกจากระบบ</button>` : ""}</div></form>`;
    $("#f").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
      me = { name: f.get("name").trim(), cls: f.get("cls").trim(), no: f.get("no").trim() }; if (!me.name || !me.cls || !me.no) return;
      LS.set("m3:me", me); SS.del("m3:t"); SS.del("m3:tp"); role = "student"; location.hash = "#home"; };
    const out = $("#out"); if (out) out.onclick = () => { LS.del("m3:me"); me = null; role = null; route(); };
  };
  $(".pick").onclick = e => { const b = e.target.closest("[data-r]"); if (!b) return; pickRole = b.dataset.r;
    document.querySelectorAll(".role").forEach(x => x.classList.toggle("on", x === b)); form(); };
  form();
}
function viewContents() {
  $("#v-contents").innerHTML = `<div class="sec" style="margin-top:4px"><h2>🗂️ Learning Units · สารบัญ Get Involved! ม.3</h2></div>
    <div class="units">${UNITS.map(u => { const sc = role === "student" ? unitScore(u) : null;
      const acts = !u.dir ? "" : !role ? `<div class="acts"><a class="btn s p" href="#login">เลือกผู้ใช้งาน →</a></div>`
        : role === "teacher" ? `<div class="acts"><a class="btn s p" href="${u.dir}#teacher">📽️ สไลด์สอน</a><a class="btn s" href="${u.dir}#teacher-results">📊 ผลนักเรียน</a><a class="btn s" href="${u.dir}#map">📖 ดูบทเรียน</a></div>`
        : `<div class="acts"><a class="btn s p" href="${u.dir}#map">📖 เข้าบทเรียน</a><a class="btn s" href="${u.dir}#slides">📽️ สไลด์บทเรียน</a></div>`;
      return `<div class="u ${u.dir ? "" : "off"}" style="--c:${u.c}"><div class="cover" style="--bg:url(assets/bg/unit${u.n}.svg)"><span class="tag">${u.dir ? "เปิดเรียน" : "เร็ว ๆ นี้"}</span><span class="num"><small>UNIT</small>${u.n}</span><img src="assets/icons/unit${u.n}.png" alt="${esc(u.t)}"></div>
        <div class="body"><span class="no">บทที่ ${u.n} · Unit ${u.n} · เทอม ${u.term}</span><b>${u.t}</b><small>${esc(u.th)} · ${u.g}</small>
        ${sc ? `<small><b style="font-size:17px;color:var(--c)">${sc.total.toFixed(2)} / 10</b> · ข้อสอบย่อย ${sc.done}/6</small>` : ""}${acts}</div></div>`; }).join("")}</div>
    <p class="muted" style="margin-top:18px;font-size:15px">เลขบทตรงกับหนังสือ · เทอม 2 เรียน Unit 6–8 · Grammar bootcamp p116 · Pronunciation p128</p>`;
}
function route() {
  const h = (location.hash || "").slice(1);
  let v = h === "login" || h === "contents" || h === "home" ? h : (role ? "home" : "login");
  if (v === "home") viewHome(); else if (v === "login") viewLogin(); else viewContents();
  nav(v);
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  $("#side").classList.remove("open"); window.scrollTo(0, 0);
}
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
window.addEventListener("hashchange", route); route();
})();
</script>
</body>
</html>
